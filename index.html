function setupScreen(err=''){$('#app').innerHTML=`<div class=authwrap><div class="card authbox"><div class=authbrand><div class=mark>CT</div><div><h1>CourseTrack</h1><div class=meta>One-time Firebase setup on this device</div></div></div><p class=notice>This screen is only for setup/testing. For the published website, paste the Firebase configuration into this file before uploading to GitHub so instructors never see this screen.</p><label>Paste Firebase config<textarea id=cfg class=setupcode placeholder='apiKey: "...", authDomain: "..."'></textarea></label>${err?`<p style="color:var(--red)">${esc(err)}</p>`:''}<button onclick=saveSetup()>Save & continue</button></div></div>`}
function saveSetup(){const t=$('#cfg').value,o={};for(const m of t.matchAll(/(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId)\\s*:\\s*["']([^"']+)["']/g))o[m[1]]=m[2];if(!o.apiKey||!o.projectId||!o.appId)return alert('Could not find apiKey, projectId and appId. Paste the complete Firebase web config.');safeLS('coursetrackFirebase',JSON.stringify(o));location.reload()}
async function onAuth(u){clearSubs();S={...S,user:u,profile:null,memberships:[],courses:[],requests:[],active:null,course:null,labs:[],students:[],members:[],loading:true};if(!u)return loginScreen();try{const ref=db.doc('users/'+u.uid),snap=await ref.get();if(!snap.exists){await ref.set({displayName:u.displayName||u.email?.split('@')[0]||'User',email:u.email||'',facultyId:'',globalRole:'user',createdAt:$ts()});}unsubs.push(ref.onSnapshot(d=>{S.profile={id:d.id,...d.data()};subscribeHome()}));}catch(e){errorScreen(e)}}
function loginScreen(err=''){$('#app').innerHTML=`<div class=authwrap><div class="card authbox"><div class=authbrand><div class=mark>CT</div><div><h1>CourseTrack</h1><div class=meta>University Attendance & Grading</div></div></div><div class=stack><label>Email<input id=lem type=email autocomplete=email></label><label>Password<input id=lpw type=password autocomplete=current-password></label>${err?`<div style="color:var(--red)">${esc(err)}</div>`:''}<button onclick=signIn()>Sign in</button><button class=secondary onclick=registerScreen()>Create CourseTrack account</button><button class=linkbtn onclick=forgotPassword()>Forgot password?</button></div></div></div>`}
function registerScreen(){$('#app').innerHTML=`<div class=authwrap><div class="card authbox"><div class=authbrand><div class=mark>CT</div><div><h1>Create account</h1><div class=meta>Use your university email</div></div></div><div class=stack><label>Full name<input id=rname autocomplete=name></label><label>University email<input id=rem type=email autocomplete=email></label><label>Faculty code<input id=rfac placeholder="e.g. pharmacy" autocapitalize=none></label><label>Password<input id=rpw type=password autocomplete=new-password></label><label>Confirm password<input id=rpw2 type=password autocomplete=new-password></label><button onclick=registerUser()>Create account</button><button class=secondary onclick="loginScreen()">Back to sign in</button></div></div></div>`}
async function signIn(){try{await auth.signInWithEmailAndPassword($('#lem').value.trim(),$('#lpw').value)}catch(e){loginScreen(e.message)}}
async function registerUser(){const name=$('#rname').value.trim(),email=$('#rem').value.trim(),fac=$('#rfac').value.trim().toLowerCase(),pw=$('#rpw').value,pw2=$('#rpw2').value;if(!name||!email||!fac||pw.length<6)return alert('Enter name, email, faculty code and a password of at least 6 characters.');if(pw!==pw2)return alert('Passwords do not match.');try{const r=await auth.createUserWithEmailAndPassword(email,pw);await r.user.updateProfile({displayName:name});await db.doc('users/'+r.user.uid).set({displayName:name,email,facultyId:fac,globalRole:'user',createdAt:$ts()});}catch(e){alert(e.message)}}
async function forgotPassword(){const email=prompt('Enter your CourseTrack email');if(!email)return;try{await auth.sendPasswordResetEmail(email.trim());alert('Password reset email sent.')}catch(e){alert(e.message)}}
function clearSubs(){courseSubs.forEach(f=>{try{f()}catch(_){}});courseSubs=[];unsubs.forEach(f=>{try{f()}catch(_){}});unsubs=[];homeSubscribed=false}
let homeSubscribed=false;function subscribeHome(){if(!S.profile||homeSubscribed)return;homeSubscribed=true;S.loading=true;render();const uid=S.user.uid;unsubs.push(db.collection('memberships').where('uid','==',uid).onSnapshot(q=>{S.memberships=q.docs.map(d=>({_:d.id,...d.data()}));refreshCourses()}));if(S.profile.globalRole==='faculty_admin'){unsubs.push(db.collection('coordinatorRequests').where('facultyId','==',S.profile.facultyId).onSnapshot(q=>{S.requests=q.docs.map(d=>({_:d.id,...d.data()})).filter(x=>x.status==='pending');render()}));}}
async function refreshCourses(){const ids=[...new Set(S.memberships.filter(m=>m.approved).map(m=>m.courseId).filter(Boolean))];if(S.profile?.globalRole==='faculty_admin'){try{const q=await db.collection('courses').where('facultyId','==',S.profile.facultyId).get();q.docs.forEach(d=>ids.push(d.id))}catch(_){}}const uniq=[...new Set(ids)];const arr=[];for(const id of uniq){try{const d=await db.doc('courses/'+id).get();if(d.exists)arr.push({id:d.id,...d.data()})}catch(_){}}S.courses=arr.sort((a,b)=>(a.code||'').localeCompare(b.code||''));S.loading=false;const wanted=courseIdFromUrl();if(wanted&&!S.active&&S.courses.some(c=>c.id===wanted)){openCourse(wanted);return}render()}
function courseIdFromUrl(){try{return new URLSearchParams(location.search).get('course')||''}catch(_){return''}}
function role(){if(S.profile?.globalRole==='faculty_admin')return'Faculty Admin';const m=currentMembership();return m?.role==='coordinator'?'Course Coordinator':m?.approved?'Course Instructor':'User'}
function currentMembership(){return S.memberships.find(m=>m.courseId===S.active&&m.uid===S.user?.uid)||null}
function isCoordinator(){return role()==='Course Coordinator'||role()==='Faculty Admin'}
function perm(k){if(isCoordinator())return true;return !!currentMembership()?.permissions?.[k]}
function canGrade(aid){if(isCoordinator())return true;const p=currentMembership()?.permissions||{};return !!p.grading&&(p.gradeItems?.['*']||p.gradeItems?.[aid])}
function appbar(){const name=S.profile?.displayName||S.user?.email||'User';return `<div class=appbar><div class=brand><div class=mark>CT</div><div><b>CourseTrack</b><small>University Attendance & Grading · Free v1</small></div></div><div class=spacer></div><span class=rolechip>${esc(role())}</span><div class=userchip><div class=avatar>${esc((name.trim()[0]||'U').toUpperCase())}</div><span>${esc(name)}</span><button class="small secondary" onclick="auth.signOut()">Sign out</button></div></div>`}
function render(){if(!S.user)return;const a=document.activeElement,f=a?.dataset?.f,ss=typeof a?.selectionStart==='number'?a.selectionStart:null,se=typeof a?.selectionEnd==='number'?a.selectionEnd:null;$('#app').innerHTML=appbar()+(S.loading?'<div class=loading>Loading CourseTrack…</div>':S.view==='home'?home():courseView());if(f){const e=document.querySelector(`[data-f="${CSS.escape(f)}"]`);if(e){e.focus();if(ss!==null&&typeof e.setSelectionRange==='function'){const L=String(e.value??'').length;try{e.setSelectionRange(Math.min(ss,L),Math.min(se??ss,L))}catch(_){}}}}requestAnimationFrame(applySyncedScroll)}
function errorScreen(e){$('#app').innerHTML=`<div class=authwrap><div class="card authbox"><h2>CourseTrack could not load</h2><p>${esc(e?.message||e)}</p><button onclick=location.reload()>Reload</button></div></div>`}
function home(){const mine=S.courses.map(c=>{const m=S.memberships.find(x=>x.courseId===c.id&&x.uid===S.user.uid);const rr=S.profile.globalRole==='faculty_admin'?'Faculty Admin':m?.role==='coordinator'?'Coordinator':'Instructor';return `<div class=course><div><h3>${esc(c.code)} · ${esc(c.name||'Course')}</h3><div class=meta>${esc(c.semester||'')} · ${esc(c.facultyId||'')}</div><div class=badges><span class="badge blue">${esc(rr)}</span></div></div><button onclick="openCourse('${c.id}')">Open course</button></div>`}).join('')||'<div class=empty>No approved courses yet.</div>';const pend=S.memberships.filter(m=>!m.approved).map(m=>`<div class=course pending><div><b>${esc(m.courseCode||m.courseId||'Course')}</b><div class=meta>${esc(m.semester||'')} · awaiting coordinator approval</div></div></div>`).join('');const fa=S.profile.globalRole==='faculty_admin'?facultyAdminPanel():'';return `<main class=shell><div class=homegrid><section class=card><div class=section-title><div><h2>My Courses</h2><p>Open a course or use its direct course URL.</p></div></div><div class=course-list>${mine}${pend}</div></section><section class=card><div class=section-title><div><h2>Join or create course</h2><p>Course code + semester identifies one offering.</p></div></div><div class=stack><label>Course code<input id=jcode placeholder="e.g. PPC101" autocapitalize=characters></label><label>Semester<select id=jsem>${SEMS.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Role<select id=jrole><option value=instructor>Course Instructor</option><option value=coordinator>Course Coordinator</option></select></label><label id=jnlabel style="display:none">Course name<input id=jname placeholder="e.g. Medicinal Plants"></label><button onclick=joinOrCreate()>Continue</button><div class=notice>Course Coordinators require Faculty Admin approval. Course Instructors require Course Coordinator approval.</div></div></section></div>${fa}</main>`}
document.addEventListener('change',e=>{if(e.target?.id==='jrole')$('#jnlabel').style.display=e.target.value==='coordinator'?'block':'none'})
function facultyAdminPanel(){return `<section class="card facultybox"><div class=section-title><div><h2>Faculty administration</h2><p>Approve Course Coordinators for ${esc(S.profile.facultyId||'this faculty')}.</p></div></div>${S.requests.length?S.requests.map(r=>`<div class=course><div><b>${esc(r.code)} · ${esc(r.name||'Course')}</b><div class=meta>${esc(r.semester)} · requested by ${esc(r.displayName||r.email||r.uid)}</div></div><div class=courseactions><button onclick="approveCoordinator('${r._}')">Approve</button><button class="secondary" onclick="rejectCoordinator('${r._}')">Reject</button></div></div>`).join(''):'<div class=empty>No pending coordinator requests.</div>'}</section>`}
async function joinOrCreate(){const code=$('#jcode').value.trim().toUpperCase(),semester=$('#jsem').value,rr=$('#jrole').value;if(!code)return alert('Enter the course code.');if(rr==='coordinator'){const name=$('#jname').value.trim()||code;await db.collection('coordinatorRequests').add({uid:S.user.uid,displayName:S.profile.displayName,email:S.profile.email||S.user.email,facultyId:S.profile.facultyId,code,name,semester,status:'pending',createdAt:$ts()});alert('Coordinator request sent to the Faculty Admin.');return}const q=await db.collection('courses').where('facultyId','==',S.profile.facultyId).where('code','==',code).get();const c=q.docs.find(d=>d.data().semester===semester);if(!c)return alert('No matching course was found. Ask the coordinator to create it first.');const id=c.id+'_'+S.user.uid;await db.doc('memberships/'+id).set({courseId:c.id,courseCode:code,semester,uid:S.user.uid,displayName:S.profile.displayName,email:S.profile.email||S.user.email,role:'instructor',approved:false,facultyId:S.profile.facultyId,permissions:{attendance:false,roster:false,lockAttendance:false,exports:false,grading:false,gradeItems:{}},createdAt:$ts()},{merge:true});alert('Join request sent to the Course Coordinator.')}
async function approveCoordinator(id){const ref=db.doc('coordinatorRequests/'+id),d=await ref.get();if(!d.exists)return;const r=d.data(),cid=(r.code+'-'+r.semester.replace(/[^A-Za-z0-9]+/g,'-')+'-'+Date.now().toString(36)).toLowerCase();const c=db.doc('courses/'+cid),m=db.doc('memberships/'+cid+'_'+r.uid),b=db.batch();b.set(c,{code:r.code,name:r.name,semester:r.semester,facultyId:r.facultyId,coordinatorUid:r.uid,coordinatorName:r.displayName||r.email,weeks:12,lectures:3,altLabLimit:2,assessments:DEFAULT_ASSESS,calculations:[],attendanceGrade:{mode:'none',max:10,deduct:1,bandBasis:'absent',bandRules:[{op:'<=',n:1,grade:10},{op:'=',n:2,grade:9},{op:'>=',n:5,grade:0}]},template:{Midterm:['mid'],Classwork:[], 'Practical Exam':[], 'Total Coursework':[]},gradeLocks:{},createdAt:$ts()});b.set(m,{courseId:cid,courseCode:r.code,semester:r.semester,uid:r.uid,displayName:r.displayName,email:r.email,role:'coordinator',approved:true,facultyId:r.facultyId,permissions:{attendance:true,roster:true,lockAttendance:true,exports:true,grading:true,gradeItems:{'*':true}},createdAt:$ts()});b.update(ref,{status:'approved',courseId:cid,approvedAt:$ts(),approvedBy:S.user.uid});await b.commit();alert('Coordinator approved and course created.')}
async function rejectCoordinator(id){await db.doc('coordinatorRequests/'+id).update({status:'rejected',decidedAt:$ts(),decidedBy:S.user.uid})}
function clearCourseSubs(){courseSubs.forEach(f=>{try{f()}catch(_){}});courseSubs=[]}
function openCourse(id){clearCourseSubs();S.active=id;S.view='course';S.tab='attendance';S.course=S.courses.find(c=>c.id===id)||null;S.labs=[];S.students=[];S.members=[];S.attLab='';S.gradeLab='';S.attWeek=1;detailScrollX=0;try{history.replaceState(null,'',location.pathname+'?course='+encodeURIComponent(id))}catch(_){}subscribeCourse(id);render()}
function goHome(){clearCourseSubs();S.active=null;S.view='home';S.course=null;S.labs=[];S.students=[];S.members=[];try{history.replaceState(null,'',location.pathname)}catch(_){}render()}
function subscribeCourse(id){courseSubs.push(db.doc('courses/'+id).onSnapshot(d=>{if(!d.exists){alert('Course no longer exists.');goHome();return}S.course={id:d.id,...d.data()};render()}));courseSubs.push(db.collection('courses/'+id+'/labs').onSnapshot(q=>{S.labs=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||'',undefined,{numeric:true}));if(!S.labs.some(l=>l.id===S.attLab))S.attLab=S.labs[0]?.id||'';render()}));courseSubs.push(db.collection('courses/'+id+'/students').onSnapshot(q=>{S.students=q.docs.map(d=>({_:d.id,...d.data()})).filter(s=>s.active!==false).sort(serialCmp);render()}));if(isCoordinator())courseSubs.push(db.collection('memberships').where('courseId','==',id).onSnapshot(q=>{S.members=q.docs.map(d=>({_:d.id,...d.data()}));render()}));else{const m=currentMembership();S.members=m?[m]:[]}}
function courseView(){const c=S.course;if(!c)return'<main class=shell><div class=card>Loading course…</div></main>';const tabs=[['attendance','Attendance'],['grades','Grades'],['students','Students'],['instructors','Instructors'],['setup','Course Setup']];return `<div class=coursebar><button class=courseback onclick=goHome() title="Back to courses">←</button><div class=coursetitle><b>${esc(c.code)} · ${esc(c.name)}</b><span>${esc(c.semester)} · Coordinator: ${esc(c.coordinatorName||'')}</span></div><button class=coursemenu onclick=courseMenu() title="Course menu">⋮</button></div><div class=tabs>${tabs.map(([k,n])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';detailScrollX=0;render()">${n}</button>`).join('')}</div><main class=shell>${S.tab==='attendance'?attendance():S.tab==='grades'?grades():S.tab==='students'?studentsPage():S.tab==='instructors'?instructorsPage():setupPage()}</main>`}
function courseMenu(){$('#modal').innerHTML=`<div class=modal><div class=dialog><h2>${esc(S.course.code)} · ${esc(S.course.name)}</h2><p class=meta>${esc(S.course.semester)}</p><div class=menuitems><button onclick=copyCourseUrl()>Copy course URL</button><button class=secondary onclick=downloadBackup()>Download course backup</button><button class=secondary onclick="$('#modal').innerHTML=''">Close</button></div></div></div>`}
function copyCourseUrl(){const u=location.origin+location.pathname+'?course='+encodeURIComponent(S.active);if(navigator.clipboard?.writeText)navigator.clipboard.writeText(u).then(()=>alert('Course URL copied.')).catch(()=>prompt('Copy this URL',u));else prompt('Copy this URL',u)}
function serialCmp(a,b){return (+a.serial||999999)-(+b.serial||999999)||String(a.sid||'').localeCompare(String(b.sid||''),undefined,{numeric:true})}
function labName(id){return S.labs.find(l=>l.id===id)?.name||'Unassigned'}
function counts(s){const v=Object.values(s.att||{});return{p:v.filter(x=>x==='P'||x==='X').length,a:v.filter(x=>x==='A').length}}
function currentLab(){return S.labs.find(l=>l.id===S.attLab)}
function isWeekLocked(w=S.attWeek){return !!currentLab()?.locked?.[w]}
function canTakeAttendance(l=currentLab()){return isCoordinator()||!!currentMembership()?.permissions?.attendance&&(l?.staff||[]).includes(S.user.uid)}
function canLockAttendance(l=currentLab()){return isCoordinator()||!!currentMembership()?.permissions?.lockAttendance&&(l?.staff||[]).includes(S.user.uid)}
function normalizeQ(q){return String(q||'').trim().toLowerCase()}
function matchStudent(s,q){q=normalizeQ(q);return !q||`${s.serial||''} ${s.sid||''} ${s.name||''}`.toLowerCase().includes(q)}
function homeLabStudents(){return S.students.filter(s=>s.lab===S.attLab).sort(serialCmp)}
function attendanceStudents(){const list=homeLabStudents(),q=S.attQ;return q?list.filter(s=>matchStudent(s,q)):list}
function universalForeignMatches(){if(!S.attQ)return[];return S.students.filter(s=>s.lab!==S.attLab&&matchStudent(s,S.attQ)).slice(0,20)}
function attendance(){if(!S.labs.length)return `<section class=card><h2>Attendance</h2><p class=meta>No labs yet. The Course Coordinator can create labs from Students or Course Setup.</p></section>`;const l=currentLab(),shown=attendanceStudents(),foreign=shown.length?[]:universalForeignMatches(),locked=isWeekLocked(),c=S.course;const attAllowed=canTakeAttendance(l);return `<section class="card attpanel"><div class=atthead><div class=attlab><select onchange="S.attLab=this.value;S.attQ='';detailScrollX=0;render()">${S.labs.map(x=>`<option value="${x.id}" ${x.id===S.attLab?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div class=place><span>Place</span><input value="${esc(l?.place||'')}" ${isCoordinator()?'':'disabled'} onchange="updateLabField('place',this.value)"></div></div><span class="badge ${locked?'red':'blue'}">${locked?'Locked':'Unlocked'}</span></div><div class=session><div class=session-title><span>Attendance session</span><span class=meta>${(l.staff||[]).length?`Assigned staff: ${(l.staff||[]).map(uid=>S.members.find(m=>m.uid===uid)?.displayName||uid).join(', ')}`:'No staff assigned'}</span></div><div class=session-body><label>Session week<select onchange="S.attWeek=+this.value;render()">${Array.from({length:+c.weeks||12},(_,i)=>i+1).map(w=>`<option value="${w}" ${w===S.attWeek?'selected':''}>Week ${w}</option>`).join('')}</select></label><label>Session date<input type=date value="${esc(l.dates?.[S.attWeek]||'')}" ${attAllowed?'':'disabled'} onchange="setWeekDate(this.value)"></label><button class="secondary weeklock" onclick=toggleWeekLock() ${canLockAttendance(l)?'':'disabled'}>${locked?'Unlock':'Lock'} Week ${S.attWeek}</button></div></div><div class=session-actions><button class=secondary onclick=startAttendanceFocus() ${(!attAllowed||locked)?'disabled':''}>Focus mode</button><button onclick=startQrAttendance() ${(!attAllowed||locked)?'disabled':''}>▣ Scan QR</button><button onclick=openVisitor() ${(!attAllowed||locked)?'disabled':''}>+ Visiting student</button></div><div class=searchbar><input data-f=attq value="${esc(S.attQ)}" placeholder="Search all labs by serial, ID or name" oninput="S.attQ=this.value;render()"><span class=searchcount>${shown.length?`Showing ${shown.length} in this lab`:S.attQ?`${foreign.length} match${foreign.length===1?'':'es'} in other labs`:`${shown.length} students`}</span></div>${foreign.length?`<div class=foreignresults><b>Student found in another lab</b>${foreign.map(s=>`<div class=foreignrow><div class=grow><b>${esc(s.sid)} · ${esc(s.name)}</b><span class=meta>Serial ${esc(s.serial||'—')} · ${esc(labName(s.lab))}</span></div><button class="small secondary" onclick="goToStudentLab('${s._}')">Go to ${esc(labName(s.lab))}</button></div>`).join('')}</div>`:''}<details class=tools><summary>Roster & export</summary><div class=row style="margin-top:9px"><button class=secondary onclick=openQrStickers()>QR stickers</button><button class=secondary onclick=exportAttendance() ${perm('exports')?'':'disabled'}>Export attendance</button><button class=secondary onclick=downloadBackup() ${perm('exports')?'':'disabled'}>Download course backup</button></div></details></section>${shown.length?studentAttendanceTable(shown,attAllowed):'<div class="card empty">No students in this lab match the search.</div>'}`}
function studentAttendanceTable(list,attAllowed){const W=+S.course.weeks||12;return `<div class=studenttable><div class=studenthdr><div>Serial</div><div>ID</div><div>Name</div></div>${list.map(s=>{const c=counts(s);return `<div class=studentgroup><div class=studentmain><div class=serialcell>${esc(s.serial||'—')}</div><div class=idcell>${esc(s.sid||'—')}</div><div class=namecell><div class=studentname>${esc(s.name||'Unnamed student')}</div><div class=rowmeta><span>Lecture ${esc(s.lecture||'—')}</span><span>Att ${c.p}</span><span>Abs ${c.a}</span></div></div></div><div class=studentdetail><div class=syncstrip onpointerdown="syncDragStart(event,this)" onpointermove="syncDragMove(event)" onpointerup="syncDragEnd(event)" onpointercancel="syncDragEnd(event)" onwheel="syncWheel(event)"><div class=syncinner>${Array.from({length:W},(_,i)=>i+1).map(w=>{const v=s.att?.[w]||'';return `<div class=attcell><button class="attplain ${v}" onclick="if(syncClickGuard())return;markAttendance('${s._}',${w})" ${(!attAllowed||currentLab()?.locked?.[w])?'disabled':''}><span class=attweek>W${w}</span><span class=attmark>${v==='P'?'✓':v==='A'?'✕':v==='X'?'↗':'·'}</span></button></div>`}).join('')}</div></div></div></div>`}).join('')}</div>`}
async function updateLabField(k,v){if(!isCoordinator())return;await db.doc(`courses/${S.active}/labs/${S.attLab}`).update({[k]:v})}
async function setWeekDate(v){if(!canTakeAttendance())return;await db.doc(`courses/${S.active}/labs/${S.attLab}`).update({['dates.'+S.attWeek]:v})}
async function toggleWeekLock(){if(!canLockAttendance())return;await db.doc(`courses/${S.active}/labs/${S.attLab}`).update({['locked.'+S.attWeek]:!isWeekLocked()})}
async function markAttendance(id,w){if(!canTakeAttendance()||currentLab()?.locked?.[w])return;const s=S.students.find(x=>x._===id);if(!s)return;const cur=s.att?.[w]||'',next=cur==='P'?'A':cur==='A'?'':'P',u={};u['att.'+w]=next||firebase.firestore.FieldValue.delete();if(cur==='X')u['alt.'+w]=firebase.firestore.FieldValue.delete();await db.doc(`courses/${S.active}/students/${id}`).update(u)}
function goToStudentLab(id){const s=S.students.find(x=>x._===id);if(!s)return;S.attLab=s.lab;S.attQ=s.sid||s.name;detailScrollX=0;render()}

let VIS={pool:[],query:'',selected:null};
function openVisitor(){if(!canTakeAttendance()||isWeekLocked())return;VIS.pool=S.students.filter(s=>s.lab!==S.attLab).sort(serialCmp);VIS.query='';VIS.selected=null;$('#modal').innerHTML=`<div class=visitorov role=dialog aria-modal=true><div class=visitorpanel><div class=visitorhead><div class=grow><h2 style="margin:0">Visiting student</h2><div class=meta>Week ${S.attWeek} · attending ${esc(labName(S.attLab))}</div></div><button class=secondary onclick=closeVisitor()>Close</button></div><input id=visitorSearch class=visitorsearch type=search inputmode=search autocomplete=off autocorrect=off spellcheck=false placeholder="Search serial, ID, name or home lab"><div class=visitorhint>Students from other labs are shown below. Search works locally and does not reload the page.</div><div id=visitorResults class=visitorresults></div></div></div>`;const inp=$('#visitorSearch');const handler=()=>renderVisitorResults(inp.value);inp.addEventListener('input',handler,{passive:true});inp.addEventListener('keyup',handler,{passive:true});renderVisitorResults('');setTimeout(()=>{try{inp.focus({preventScroll:true})}catch(_){try{inp.focus()}catch(__){}}},80)}

async function confirmVisitor(id){const s=S.students.find(x=>x._===id);if(!s)return;const w=S.attWeek,cur=s.att?.[w]||'',used=Object.values(s.att||{}).filter(x=>x==='X').length,lim=Math.max(0,+S.course.altLabLimit||0);if(cur!=='X'&&used>=lim)return alert(`${s.name} has already used ${used}/${lim} visiting attendances.`);if(lim<1&&cur!=='X')return alert('Visiting attendance is currently disabled.');if(cur==='P'&&!confirm('This student is already present in the home lab this week. Replace it with attendance in this lab?'))return;await db.doc(`courses/${S.active}/students/${id}`).update({['att.'+w]:'X',['alt.'+w]:S.attLab});closeVisitor()}
function gradeScopeStudents(){const list=S.students.filter(s=>!S.gradeLab||s.lab===S.gradeLab).sort(serialCmp),q=S.gradeQ;return q?list.filter(s=>matchStudent(s,q)):list}

function calcMap(s){const out={};for(const a of S.course.assessments||[])out[a.id]=rawGrade(s,a.id);for(const c of S.course.calculations||[]){let xs=(c.sources||[]).map(id=>out[id]).filter(v=>v!==null&&!Number.isNaN(v)).sort((a,b)=>b-a),r=null;if(!xs.length){out[c.id]=null;continue}if(c.preset==='highest')r=xs[0];else if(c.preset==='highest_half')r=xs[0]/2;else if(c.preset==='avg_all')r=xs.reduce((a,b)=>a+b,0)/xs.length;else if(c.preset==='avg_high2'){xs=xs.slice(0,2);r=xs.reduce((a,b)=>a+b,0)/xs.length}else if(c.preset==='sum_high2')r=xs.slice(0,2).reduce((a,b)=>a+b,0);else r=xs.reduce((a,b)=>a+b,0);out[c.id]=Math.round(r*100)/100}return out}
function attendanceGrade(s){const r=S.course.attendanceGrade||{mode:'none'},vals=Object.values(s.att||{}),att=vals.filter(x=>x==='P'||x==='X').length,abs=vals.filter(x=>x==='A').length,W=+S.course.weeks||12;if(r.mode==='none')return null;if(r.mode==='deduct')return Math.max(0,(+r.max||0)-abs*(+r.deduct||0));if(r.mode==='proportional')return Math.round((att/W*(+r.max||0))*100)/100;if(r.mode==='bands'){const n=r.bandBasis==='attended'?att:abs;for(const b of r.bandRules||[]){if((b.op==='<='&&n<=+b.n)||(b.op==='='&&n===+b.n)||(b.op==='>='&&n>=+b.n))return +b.grade}return 0}return null}
function grades(){const shown=gradeScopeStudents(),c=S.course,ass=c.assessments||[],cal=c.calculations||[];if(!ass.find(a=>a.id===S.gradeAssessment))S.gradeAssessment=ass[0]?.id||'';return `<section class=card><div class=scopebar><label><span>Students</span><select onchange="S.gradeLab=this.value;S.gradeQ='';detailScrollX=0;render()"><option value="">All labs</option>${S.labs.map(l=>`<option value="${l.id}" ${l.id===S.gradeLab?'selected':''}>${esc(l.name)}</option>`).join('')}</select></label><span class=scopehint>Normal grading and Focus mode use this same selection. Students are sorted by serial.</span></div><div class=searchbar><input data-f=gradeq value="${esc(S.gradeQ)}" placeholder="Search by serial, ID or name" oninput="S.gradeQ=this.value;render()"><span class=searchcount>Showing ${shown.length}</span></div><div class=row style="margin-top:10px"><label style="min-width:180px">Focus score<select onchange="S.gradeAssessment=this.value;render()">${ass.map(a=>`<option value="${a.id}" ${a.id===S.gradeAssessment?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label><button onclick=startGradeFocus() ${canGrade(S.gradeAssessment)?'':'disabled'}>Focus grading</button><button class=secondary onclick=exportGrades() ${perm('exports')?'':'disabled'}>Export grades</button><button class=secondary onclick=exportUniversityTemplate() ${perm('exports')?'':'disabled'}>Export university template</button><button class=secondary onclick=downloadBackup() ${perm('exports')?'':'disabled'}>Download course backup</button></div></section>${shown.length?`<div class=studenttable style="margin-top:10px"><div class=studenthdr><div>Serial</div><div>ID</div><div>Name</div></div>${shown.map(s=>{const cm=calcMap(s);return `<div class=studentgroup><div class=studentmain><div class=serialcell>${esc(s.serial||'—')}</div><div class=idcell>${esc(s.sid||'—')}</div><div class=namecell><div class=studentname>${esc(s.name)}</div><div class=rowmeta><span>${esc(labName(s.lab))}</span></div></ function parseSisRows(wb){const sh=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(sh,{header:1,defval:'',raw:false}),out=[];for(const r of rows){let id=String(r[1]??'').trim(),name=String(r[2]??'').trim();if(!id||!name)continue;if(/^(id|student\s*id)$/i.test(id)||/^(name|student\s*name)$/i.test(name))continue;id=id.replace(/\.0$/,'');if(id.length<3)continue;out.push({sid:id,name})}const map=new Map;out.forEach(x=>map.set(x.sid,x));return [...map.values()]}

function attendanceRuleBuilder(r){const mode=r.mode||'none';return `<label><b>Attendance grade method</b><select onchange="setAttendanceMode(this.value)"><option value=none ${mode==='none'?'selected':''}>No attendance grade</option><option value=deduct ${mode==='deduct'?'selected':''}>Deduct marks for each absence</option><option value=proportional ${mode==='proportional'?'selected':''}>Grade proportional to attended sessions</option><option value=bands ${mode==='bands'?'selected':''}>Grade bands / rules</option></select></label>${mode==='none'?'<div class=notice style="margin-top:8px">Attendance is recorded but does not add to the grade.</div>':mode==='deduct'?`<div class="grid g2" style="margin-top:8px"><label>Maximum mark<input type=number step=.25 value="${esc(r.max||10)}" onchange="setAttendanceField('max',+this.value||0)"></label><label>Marks lost per absence<input type=number step=.25 value="${esc(r.deduct||1)}" onchange="setAttendanceField('deduct',+this.value||0)"></label></div>`:mode==='proportional'?`<label style="margin-top:8px">Maximum mark<input type=number step=.25 value="${esc(r.max||10)}" onchange="setAttendanceField('max',+this.value||0)"></label>`:`<div style="margin-top:8px"><label>Rules based on<select onchange="setAttendanceBandBasis(this.value)"><option value=absent ${r.bandBasis!=='attended'?'selected':''}>Number of absences</option><option value=attended ${r.bandBasis==='attended'?'selected':''}>Number of attended sessions</option></select></label>${(r.bandRules||[]).map((b,i)=>`<div class=bandrow><label>Condition<select onchange="setAttendanceBand(${i},'op',this.value)"><option value="<=" ${b.op==='<='?'selected':''}>≤</option><option value="=" ${b.op==='='?'selected':''}>=</option><option value=">=" ${b.op==='>='?'selected':''}>≥</option></select></label><label>Number<input type=number value="${esc(b.n)}" onchange="setAttendanceBand(${i},'n',+this.value||0)"></label><label>Grade<input type=number step=.25 value="${esc(b.grade)}" onchange="setAttendanceBand(${i},'grade',+this.value||0)"></label><button class="small secondary" onclick="removeAttendanceBand(${i})">Remove</button></div>`).join('')}<button class="small secondary" style="margin-top:8px" onclick=addAttendanceBand()>+ Rule</button></div>`}`}
async function setAttendanceMode(v){const r={...(S.course.attendanceGrade||{}),mode:v};if(v==='bands'&&!Array.isArray(r.bandRules))r.bandRules=[{op:'<=',n:1,grade:10},{op:'=',n:2,grade:9},{op:'>=',n:5,grade:0}];await updateCourseField('attendanceGrade',r)}async function setAttendanceField(k,v){await updateCourseField('attendanceGrade',{...(S.course.attendanceGrade||{}),[k]:v})}async function setAttendanceBandBasis(v){await updateCourseField('attendanceGrade',{...(S.course.attendanceGrade||{}),bandBasis:v})}async function setAttendanceBand(i,k,v){const r={...(S.course.attendanceGrade||{})},a=[...(r.bandRules||[])];a[i]={...a[i],[k]:v};r.bandRules=a;await updateCourseField('attendanceGrade',r)}async function addAttendanceBand(){const r={...(S.course.attendanceGrade||{})},a=[...(r.bandRules||[]),{op:'<=',n:0,grade:0}];r.bandRules=a;await updateCourseField('attendanceGrade',r)}async function removeAttendanceBand(i){const r={...(S.course.attendanceGrade||{})},a=[...(r.bandRules||[])];a.splice(i,1);r.bandRules=a;await updateCourseField('attendanceGrade',r)}

function editTemplate(k){const items=[...(S.course.assessments||[]).map(a=>({id:a.id,name:a.name})),...(S.course.calculations||[]).map(c=>({id:c.id,name:c.name}))];if(S.course.attendanceGrade?.mode!=='none')items.push({id:'attendance',name:'Attendance Grade'});const set=new Set(S.course.template?.[k]||[]);$('#modal').innerHTML=`<div class=modal><div class=dialog><h2>${esc(k)}</h2><p class=meta>Select one or more sources. CourseTrack will sum them.</p><div class=stack>${items.map(x=>`<label class=check><input type=checkbox value="${x.id}" ${set.has(x.id)?'checked':''}><span>${esc(x.name)}</span></label>`).join('')}<div class=row><button onclick="saveTemplate('${k}')">Save mapping</button><button class=secondary onclick="$('#modal').innerHTML=''">Cancel</button></div></div></div></div>`}
async function saveTemplate(k){const a=$$('#modal input[type=checkbox]:checked').map(x=>x.value),t={...(S.course.template||{}),[k]:a};$('#modal').innerHTML='';await updateCourseField('template',t)}async function setGradeLock(id,v){await db.doc('courses/'+S.active).update({['gradeLocks.'+id]:v})}
function templateValue(s,id){if(id==='attendance')return attendanceGrade(s)||0;const m=calcMap(s);return m[id]??0}
function exportAttendance(){const W=+S.course.weeks||12,rows=[['Serial','ID','Name','Lecture','Lab',...Array.from({length:W},(_,i)=>'Week '+(i+1)),'Attended','Absent']];S.students.slice().sort(serialCmp).forEach(s=>{const c=counts(s);rows.push([s.serial,s.sid,s.name,s.lecture,labName(s.lab),...Array.from({length:W},(_,i)=>{const v=s.att?.[i+1]||'';return v==='P'?'Present':v==='A'?'Absent':v==='X'?'Present (visiting)':''}),c.p,c.a])});saveWorkbook([['Attendance',rows]],`${S.course.code}_${S.course.semester}_Attendance.xlsx`)}
function exportGrades(){const ass=S.course.assessments||[],cal=S.course.calculations||[],rows=[['Serial','ID','Name','Lecture','Lab',...ass.map(a=>a.name),...cal.map(c=>c.name),...(S.course.attendanceGrade?.mode!=='none'?['Attendance Grade']:[])]];S.students.slice().sort(serialCmp).forEach(s=>{const m=calcMap(s);rows.push([s.serial,s.sid,s.name,s.lecture,labName(s.lab),...ass.map(a=>s.g?.[a.id]??''),...cal.map(c=>m[c.id]??''),...(S.course.attendanceGrade?.mode!=='none'?[attendanceGrade(s)??'']:[])])});saveWorkbook([['Grades',rows]],`${S.course.code}_${S.course.semester}_Grades.xlsx`)}
function downloadBackup(){const W=+S.course.weeks||12,ass=S.course.assessments||[],cal=S.course.calculations||[],ar=[['Serial','ID','Name','Lecture','Lab',...Array.from({length:W},(_,i)=>'Week '+(i+1)),'Attended','Absent']],gr=[['Serial','ID','Name','Lecture','Lab',...ass.map(a=>a.name),...cal.map(c=>c.name),...(S.course.attendanceGrade?.mode!=='none'?['Attendance Grade']:[])]];S.students.slice().sort(serialCmp).forEach(s=>{const cc=counts(s),m=calcMap(s);ar.push([s.serial,s.sid,s.name,s.lecture,labName(s.lab),...Array.from({length:W},(_,i)=>s.att?.[i+1]||''),cc.p,cc.a]);gr.push([s.serial,s.sid,s.name,s.lecture,labName(s.lab),...ass.map(a=>s.g?.[a.id]??''),...cal.map(c=>m[c.id]??''),...(S.course.attendanceGrade?.mode!=='none'?[attendanceGrade(s)??'']:[])])});saveWorkbook([['Attendance',ar],['Grades',gr]],`${S.course.code}_${S.course.semester}_Backup_${new Date().toISOString().slice(0,10)}.xlsx`)}
function saveWorkbook(sheets,name){const wb=XLSX.utils.book_new();for(const [n,rows] of sheets)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),n);XLSX.writeFile(wb,name.replace(/[\\/:*?\"<>|]+/g,'_'))}
/* focus attendance / grading */
function startAttendanceFocus(){const xs=attendanceStudents();if(!xs.length)return alert('No students in this selection.');FO={type:'att',ids:xs.map(s=>s._),i:0,lab:S.attLab,w:S.attWeek};renderFocus()}function startGradeFocus(){const a=S.course.assessments.find(x=>x.id===S.gradeAssessment);if(!a)return;if(!canGrade(a.id)||S.course.gradeLocks?.[a.id])return alert('You cannot edit this assessment.');const xs=gradeScopeStudents();if(!xs.length)return alert('No students in this selection.');FO={type:'gr',ids:xs.map(s=>s._),i:0,aid:a.id,entry:''};renderFocus()}function focusStudent(){return S.students.find(s=>s._===FO?.ids?.[FO.i])}function closeFocus(){FO=null;$('#modal').innerHTML=''}function stepFocus(d){FO.i=Math.max(0,Math.min(FO.ids.length,FO.i+d));renderFocus()}
function renderFocus(){const s=focusStudent();if(!s)return $('#modal').innerHTML=`<div class=focusov><div class=focuspanel><div class=focuscard><h2>Complete</h2><button onclick=closeFocus()>Close</button></div></div></div>`;if(FO.type==='att'){const v=s.att?.[FO.w]||'';$('#modal').innerHTML=`<div class=focusov><div class=focuspanel><div class=focushead><b>Focus attendance</b><div class=spacer></div><span class=badge>${FO.i+1}/${FO.ids.length}</span><button class=secondary onclick=closeFocus()>Exit</button></div><div class=focuscard><div class=focusid>${esc(s.sid)}</div><div class=focusname>${esc(s.name)}</div><div class=badges><span class=badge>Serial ${esc(s.serial||'—')}</span><span class=badge>${esc(v||'Not marked')}</span></div><div class=focusactions><button onclick="focusAttSave('P')">✓ Attended</button><button class=danger onclick="focusAttSave('A')">✕ Absent</button></div><div class=row style="margin-top:10px"><button class=secondary onclick="stepFocus(-1)" ${FO.i===0?'disabled':''}>Previous</button><button class=secondary onclick="stepFocus(1)">Skip / Next</button></div></div></div></div>`;return}const a=S.course.assessments.find(x=>x.id===FO.aid),cur=s.g?.[FO.aid];FO.entry=cur==='Abs'?'':String(cur??'');$('#modal').innerHTML=`<div class=focusov><div class=focuspanel><div class=focushead><b>Focus grading · ${esc(a.name)}</b><div class=spacer></div><span class=badge>${FO.i+1}/${FO.ids.length}</span><button class=secondary onclick=closeFocus()>Exit</button></div><div class=focuscard><div class=focusid>${esc(s.sid)}</div><div class=focusname>${esc(s.name)}</div><div class=badges><span class=badge>Serial ${esc(s.serial||'—')}</span><span class=badge>${esc(labName(s.lab))}</span></div></div><div class=focusgradeconsole><div id=fgdisplay class=focusdisplay>${esc(prettyEntry(FO.entry)||'—')}</div><div class=focuskeypad>${[['1','2','3','¼'],['4','5','6','½'],['7','8','9','¾'],['.','0','⌫','C']].flat().map(k=>`<button class="${['¼','½','¾'].includes(k)?'fraction':''}" onclick="focusKey('${k}')">${k}</button>`).join('')}</div><div class=focusprimary><button class=danger onclick=focusAbs()>ABS & Next</button><button onclick=focusSave()>Save & Next</button></div><div class=focusutility><button onclick="stepFocus(-1)" ${FO.i===0?'disabled':''}>Previous</button><button onclick="stepFocus(1)">Skip / Next</button><button onclick=focusClearScore()>Clear score</button></div></div></div></div>`}
async function focusAttSave(v){const id=FO.ids[FO.i];await db.doc(`courses/${S.active}/students/${id}`).update({['att.'+FO.w]:v,['alt.'+FO.w]:firebase.firestore.FieldValue.delete()});FO.i++;renderFocus()}function prettyEntry(v){if(v==='')return'';const n=+v,i=Math.floor(n),f=Math.round((n-i)*4);return f===1?`${i}¼`:f===2?`${i}½`:f===3?`${i}¾`:String(n)}function updateFocusDisplay(){const e=$('#fgdisplay');if(e)e.textContent=prettyEntry(FO.entry)||'—'}function focusKey(k){if(k==='C'){FO.entry='';return updateFocusDisplay()}if(k==='⌫'){FO.entry=String(FO.entry).slice(0,-1);return updateFocusDisplay()}if(['¼','½','¾'].includes(k)){const add=k==='¼'?.25:k==='½'?.5:.75;FO.entry=String((+FO.entry||0)+add);return updateFocusDisplay()}if(k==='.'&&String(FO.entry).includes('.'))return;FO.entry+=k;updateFocusDisplay()}async function focusSave(){const a=S.course.assessments.find(x=>x.id===FO.aid),n=+FO.entry;if(FO.entry===''||Number.isNaN(n)||n<0||n>+a.max)return alert(`Enter a score from 0 to ${a.max}.`);await db.doc(`courses/${S.active}/students/${FO.ids[FO.i]}`).update({['g.'+FO.aid]:n});FO.i++;renderFocus()}async function focusAbs(){await db.doc(`courses/${S.active}/students/${FO.ids[FO.i]}`).update({['g.'+FO.aid]:'Abs'});FO.i++;renderFocus()}async function focusClearScore(){await db.doc(`courses/${S.active}/students/${FO.ids[FO.i]}`).update({['g.'+FO.aid]:firebase.firestore.FieldValue.delete()});FO.entry='';updateFocusDisplay()}
function exportUniversityTemplate(){const fields=['Midterm','Classwork','Practical Exam','Total Coursework'],rows=[['Serial','ID','Name','Lecture','Lab',...fields]];S.students.slice().sort(serialCmp).forEach(s=>{rows.push([s.serial,s.sid,s.name,s.lecture,labName(s.lab),...fields.map(k=>(S.course.template?.[k]||[]).reduce((sum,id)=>sum+(+templateValue(s,id)||0),0))])});saveWorkbook([['University Template',rows]],`${S.course.code}_${S.course.semester}_University_Grade_Template.xlsx`)}
function openQrStickers(){if(!window.QRCode)return alert('QR generator library did not load. Check internet connection.');$('#modal').innerHTML=`<div class=modal><div class=dialog style="width:min(900px,100%)"><div class=row><div class=grow><h2 style="margin:0">Student QR stickers</h2><div class=meta>QR content is the Student ID. Printed QR = 18 × 18 mm inside a 25 × 25 mm white sticker.</div></div><button onclick=window.print()>Print</button><button class=secondary onclick="$('#modal').innerHTML=''">Close</button></div><label style="margin-top:10px">Students<select id=qrscope onchange=renderQrStickers(this.value)><option value="">All labs</option>${S.labs.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></label><div id=qrprint style="margin-top:10px"><div id=qrgrid class=qrprintgrid></div></div></div></div>`;renderQrStickers('')}
function renderQrStickers(lab){const list=S.students.filter(s=>s.sid&&(!lab||s.lab===lab)).sort(serialCmp),g=$('#qrgrid');if(!g)return;g.innerHTML=list.map((s,i)=>`<div class=qrprintitem><div class=qrsticker><div id="qr_${i}"></div></div><div class=qrwho><b>${esc(s.serial||'—')} · ${esc(s.sid)}</b><br>${esc(s.name)}</div></div>`).join('');requestAnimationFrame(()=>list.forEach((s,i)=>new QRCode(document.getElementById('qr_'+i),{text:String(s.sid).trim(),width:256,height:256,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.Q})))}
/* QR scanner */
async function startQrAttendance(){if(!window.Html5Qrcode)return alert('QR scanner library did not load. Check internet connection.');if(!canTakeAttendance()||isWeekLocked())return;$('#modal').innerHTML=`<div class=qrshade><div class=qrscanpanel><div id=qr-reader></div><div class=qrtop><b>QR attendance · ${esc(labName(S.attLab))} · Week ${S.attWeek}</b><div class=spacer></div><button class=secondary onclick=stopQr()>Close</button></div><div id=qrresult class=qrresult><div class=notice>Point the camera toward the student's QR. Precise alignment is not required.</div></div></div></div>`;try{QRSCAN=new Html5Qrcode('qr-reader');await QRSCAN.start({facingMode:'environment'},{fps:15},qrDecoded,()=>{});}catch(e){$('#qrresult').innerHTML=`<div class=notice style="background:#5a1212;color:#fff">Camera could not start: ${esc(e?.message||e)}<br>Check browser camera permission.</div>`}}async function stopQr(){if(QRSCAN){try{await QRSCAN.stop()}catch(_){}try{await QRSCAN.clear()}catch(_){}QRSCAN=null}$('#modal').innerHTML=''}let lastQr='',lastQrAt=0;async function qrDecoded(text){text=String(text||'').trim();const now=Date.now();if(text===lastQr&&now-lastQrAt<1800)return;lastQr=text;lastQrAt=now;const matches=S.students.filter(s=>String(s.sid).trim()===text);if(matches.length!==1)return qrStatus(matches.length?'Duplicate student ID':'Student not found',false);const s=matches[0],w=S.attWeek;if(s.lab===S.attLab){await db.doc(`courses/${S.active}/students/${s._}`).update({['att.'+w]:'P',['alt.'+w]:firebase.firestore.FieldValue.delete()});qrStatus(`${s.name} · Present`,true);return}const used=Object.values(s.att||{}).filter(x=>x==='X').length,lim=Math.max(0,+S.course.altLabLimit||0);if(used>=lim&&s.att?.[w]!=='X')return qrStatus(`${s.name} · visiting allowance reached`,false);await db.doc(`courses/${S.active}/students/${s._}`).update({['att.'+w]:'X',['alt.'+w]:S.attLab});qrStatus(`${s.name} · Present here as visitor`,true)}function qrStatus(t,ok){const e=$('#qrresult');if(e)e.innerHTML=`<div class=notice style="background:${ok?'#063':'#701'};color:#fff"><b>${esc(t)}</b></div>`;try{navigator.vibrate?.(ok?50:[40,60,40])}catch(_){}}
/* synchronized scrolling */
function detailMax(){const v=document.querySelector('.syncstrip'),i=v?.querySelector('.syncinner');return v&&i?Math.max(0,i.scrollWidth-v.clientWidth):0}function paintDetailScroll(){syncPaintRaf=0;document.documentElement.style.setProperty('--detail-shift',(-detailScrollX)+'px')}function setDetailScroll(x){detailScrollMax=detailMax();detailScrollX=Math.max(0,Math.min(detailScrollMax,Number.isFinite(x)?x:0));if(!syncPaintRaf)syncPaintRaf=requestAnimationFrame(paintDetailScroll)}function applySyncedScroll(){detailScrollMax=detailMax();detailScrollX=Math.min(detailScrollX,detailScrollMax);paintDetailScroll()}function stopSyncInertia(){if(syncInertiaRaf){cancelAnimationFrame(syncInertiaRaf);syncInertiaRaf=0}}function syncDragStart(e,el){if(e.pointerType==='mouse'&&e.button!==0)return;stopSyncInertia();detailScrollMax=detailMax();syncDrag={id:e.pointerId,startX:e.clientX,startY:e.clientY,startScroll:detailScrollX,lastT:performance.now(),v:0,moved:false,captured:false,el,target:e.target}}function syncDragMove(e){if(!syncDrag||e.pointerId!==syncDrag.id)return;const dx=e.clientX-syncDrag.startX,dy=e.clientY-syncDrag.startY;if(!syncDrag.moved){if(Math.abs(dx)<5)return;if(Math.abs(dy)>Math.abs(dx)*1.2)return;syncDrag.moved=true;syncSuppressClickUntil=performance.now()+320;syncDrag.el?.classList.add('dragging');if(syncDrag.target?.blur)syncDrag.target.blur();try{syncDrag.el?.setPointerCapture(e.pointerId);syncDrag.captured=true}catch(_){}}if(e.cancelable)e.preventDefault();const now=performance.now(),dt=Math.max(1,now-syncDrag.lastT),next=Math.max(0,Math.min(detailScrollMax,syncDrag.startScroll-dx)),prev=detailScrollX;setDetailScroll(next);syncDrag.v=(next-prev)/dt;syncDrag.lastT=now}function syncDragEnd(e){if(!syncDrag||e.pointerId!==syncDrag.id)return;const d=syncDrag;d.el?.classList.remove('dragging');if(d.captured)try{d.el?.releasePointerCapture(e.pointerId)}catch(_){}syncDrag=null;if(d.moved){syncSuppressClickUntil=performance.now()+320;startSyncInertia(d.v)}}function startSyncInertia(v){stopSyncInertia();if(Math.abs(v)<.05)return;let last=performance.now();const step=t=>{const dt=Math.min(32,t-last);last=t;const before=detailScrollX;setDetailScroll(detailScrollX+v*dt);if(detailScrollX===0||detailScrollX===detailScrollMax||Math.abs(detailScrollX-before)<.05)v=0;v*=Math.pow(.91,dt/16.67);if(Math.abs(v)>.02)syncInertiaRaf=requestAnimationFrame(step);else syncInertiaRaf=0};syncInertiaRaf=requestAnimationFrame(step)}function syncWheel(e){const d=Math.abs(e.deltaX)>=Math.abs(e.deltaY)?e.deltaX:(e.shiftKey?e.deltaY:0);if(!d)return;if(e.cancelable)e.preventDefault();stopSyncInertia();setDetailScroll(detailScrollX+d)}function syncClickGuard(){return performance.now()<syncSuppressClickUntil}
