/* ==============================================================
   CourseTrack · Academic Command Center visual redesign
   Pure presentation layer. Course data, permissions, Firebase,
   calculations, Excel and QR workflows remain on original code.
   ============================================================== */
:root {
  --bg:#F3F6FA; --card:#FFFFFF; --text:#142B41; --muted:#728196;
  --primary:#127C80; --line:#E1E8F0; --soft:#F7F9FC;
  --green:#0D775B; --greenbg:#DDF5E9;
  --red:#B83E3A; --redbg:#FDE9E7;
  --amber:#916313; --amberbg:#FFF4DC;
  --bluebg:#E8F0FB;
  --navy:#10243A; --navy-2:#152D48;
  --shadow:0 6px 26px rgba(32,55,79,.045);
}
html {scroll-behavior:smooth}
body {font-family:Inter,"Plus Jakarta Sans",Roboto,system-ui,-apple-system,sans-serif;line-height:1.45;letter-spacing:-.012em;}
button,input,select,textarea{font-family:inherit}
button{border-radius:10px;padding:10px 15px;font-weight:700;letter-spacing:-.014em;transition:background .16s,border-color .16s,box-shadow .16s,transform .15s;cursor:pointer}
button:not(:disabled):active{transform:translateY(1px)}
button:not(:disabled):focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #5ac2c0;outline-offset:2px}
button:hover:not(:disabled):where(:not(.secondary):not(.ghost):not(.danger):not(.attplain):not(.absbtn):not(.ct-nav-btn):not(.courseback):not(.coursemenu):not(.outline)){background:#0E6A6E}
button.secondary{background:#ECF2F6;color:#234258}
button.secondary:hover:not(:disabled){background:#DFE9F0}
button.ghost{border-color:#DCE5ED}
button.danger:hover:not(:disabled){background:#a12d2b}
input,select,textarea{border:1px solid #DBE4EC;border-radius:10px;padding:10px 12px;background:#fff;min-height:40px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:#56ABA9;box-shadow:0 0 0 3px rgba(18,124,128,.09);outline:none}
label{color:#66798D;font-size:11.5px;letter-spacing:.005em}
label input,label select,label textarea{margin-top:6px}
.card{border:1px solid #E5ECF2;border-radius:18px;padding:19px 21px;box-shadow:var(--shadow)}
.section-title{align-items:center;margin-bottom:17px;flex-wrap:wrap}
.section-title h2{font-size:19px;letter-spacing:-.035em;color:#17324A}
.section-title p{font-size:12px;line-height:1.6}
.badge{padding:5px 9px;border-radius:9px;font-size:10px;letter-spacing:.01em;background:#EFF3F7;color:#5E7286}
.badge.blue{background:#E7F3F5;color:#0D777A}
.badge.green{background:#DEF5E9;color:#117855}
.badge.warn{background:#FFF2D8;color:#94610D}
.badge.red{background:#FFEBE9;color:#B93D37}
.notice{border-radius:11px;padding:12px 14px;background:#EEF7F8;color:#456A71;line-height:1.6}
.notice.warn{background:#FFF8E8;color:#805A14}
.meta{color:#748397}
.shell{max-width:1480px;padding:22px 27px;margin:0 auto}
#app{min-height:100dvh}
.appbar{position:sticky;top:0;z-index:42;min-height:68px;padding:10px 26px;background:var(--navy);border-bottom:1px solid rgba(255,255,255,.09);box-shadow:0 2px 14px rgba(10,26,46,.13)}
.mark{height:39px;width:39px;border-radius:12px;background:#1E8386;color:white;letter-spacing:-.05em;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.brand b{font-size:19px;letter-spacing:-.045em}
.brand small{font-size:10px;color:#93A8BD;letter-spacing:.015em}
.brand{gap:11px}
.rolechip{background:#24405A;color:#D8E8F0;border:1px solid #34526B;padding:6px 11px;font-size:10px}
.userchip{gap:10px}
.userchip .avatar{width:36px;height:36px;background:#22626D;border:1px solid #39848B}
.appbar .secondary{background:#264159;color:#EAF5F7;border:1px solid #385670}
.appbar .secondary:hover:not(:disabled){background:#36536C}
.workspace{display:grid;grid-template-columns:242px minmax(0,1fr);min-height:calc(100dvh - 68px)}
.workspace-side{background:#fff;border-right:1px solid #E1E9F0;display:flex;flex-direction:column;padding:24px 14px 18px;min-width:0}
.nav-eyebrow{color:#91A0AE;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:0 13px;margin:4px 0 12px}
.course-side-meta{padding:13px 14px;background:#F3F7FA;border:1px solid #E7EDF3;border-radius:13px;margin:0 2px 23px}
.course-side-meta .code{font-size:14px;font-weight:850;color:#1D3C56;letter-spacing:-.02em}
.course-side-meta .term{font-size:11px;color:#7D8DA0;margin-top:3px;overflow-wrap:anywhere}
.ct-nav{display:grid;gap:5px}
.ct-nav-btn{display:flex;align-items:center;gap:12px;background:transparent;color:#60758B;border:0;border-radius:11px;padding:12px 13px;text-align:left;width:100%;font-weight:650;font-size:13px;box-shadow:none;min-height:45px}
.ct-nav-btn:hover:not(:disabled){background:#F2F6F8;color:#1A465B}
.ct-nav-btn.on,.ct-nav-btn.on:hover:not(:disabled){background:#E2F3F3;color:#0C7476;font-weight:800}
.ct-nav-btn .ct-ico{width:19px;height:19px;display:flex;align-items:center;justify-content:center;flex:0 0 19px}
.ct-ico svg,.ct-hero-ico svg{width:20px;height:20px;display:block;stroke:currentColor}
.ct-nav-btn.on .ct-ico{color:#0E8384}
.ct-sidebar-bottom{margin-top:auto;padding-top:22px}
.ct-sidebar-foot{margin:11px 9px 0;padding:13px;border-radius:12px;background:#F6F9FB;color:#8B9AAA;font-size:10px;line-height:1.65}
.ct-sidebar-foot b{color:#4E697E}
.workspace-main{min-width:0;background:#F4F7FA}
.coursebar{padding:22px 27px 12px;border:0;background:transparent;gap:13px}
.courseback{width:41px;height:41px;background:#fff;border:1px solid #E1E8EF;border-radius:12px;font-size:20px;box-shadow:0 2px 4px #1A344308}
.courseback:hover:not(:disabled),.coursemenu:hover:not(:disabled){background:#EAF0F3}
.coursemenu{width:41px;height:41px;background:#fff;border:1px solid #E1E8EF;border-radius:12px;box-shadow:0 2px 4px #1A344308}
.coursetitle b{font-size:23px;letter-spacing:-.05em;color:#18344B}
.coursetitle span{font-size:12px;margin-top:5px;color:#8693A1}
.workspace-main > .shell{padding-top:12px}
.tabs{display:none}
.ct-page-intro{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:17px}
.ct-page-intro .hint{font-size:12px;color:#8B98A8}
.ct-overview-hero{border-radius:19px;padding:26px 30px;background:linear-gradient(116deg,#10283E 5%,#1A4755 62%,#166F73 100%);color:white;overflow:hidden;position:relative;margin-bottom:17px}
.ct-overview-hero:before{content:"";position:absolute;width:320px;height:320px;border-radius:50%;border:1px solid rgba(255,255,255,.12);right:-80px;top:-180px;box-shadow:0 0 0 65px rgba(255,255,255,.025),0 0 0 130px rgba(255,255,255,.022);pointer-events:none}
.ct-overview-hero h2{font-size:27px;margin:4px 0 8px;letter-spacing:-.055em;max-width:620px;position:relative}
.ct-overview-hero p{color:#C0D7DE;font-size:12px;max-width:560px;position:relative;margin:0}
.ct-overview-hero .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:#87D8D1;position:relative}
.ct-overview-buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:23px;position:relative}
.ct-overview-buttons button{background:#fff;color:#16666D;border:1px solid #fff}
.ct-overview-buttons button:hover:not(:disabled){background:#E4F4F4;color:#0D6B70}
.ct-overview-buttons .outline{background:transparent;border:1px solid rgba(255,255,255,.4);color:white}
.ct-overview-buttons .outline:hover:not(:disabled){background:rgba(255,255,255,.12)}
.ct-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:0 0 15px}
.ct-stat{background:#fff;border:1px solid #E4ECF3;box-shadow:var(--shadow);border-radius:16px;padding:19px 20px;min-width:0}
.ct-stat-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ct-stat-label{font-weight:700;color:#77889B;font-size:11px}
.ct-stat-symbol{width:33px;height:33px;border-radius:10px;background:#EAF6F4;color:#11817D;display:flex;align-items:center;justify-content:center}
.ct-stat strong{display:block;font-size:29px;line-height:1.15;letter-spacing:-.065em;color:#17344A;margin-top:14px}
.ct-stat small{display:block;font-size:10px;color:#9BA8B6;margin-top:6px}
.ct-overview-lower{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(270px,.75fr);gap:15px}
.ct-labrow{display:flex;align-items:center;gap:13px;padding:13px 1px;border-top:1px solid #E9EFF3}
.ct-labrow:first-of-type{border-top:0}
.ct-labrow .ct-labicon{width:38px;height:38px;border-radius:11px;background:#EEF5F8;display:grid;place-items:center;color:#167B82}
.ct-labrow .ct-labmain{flex:1;min-width:0}
.ct-labrow .ct-labmain b{font-size:13px;color:#294358}
.ct-labrow .ct-labmain span{display:block;font-size:11px;color:#90A0AE}
.ct-labrow button{font-size:11px}
.ct-quickactions{display:grid;gap:9px}
.ct-quickactions button{width:100%;text-align:left;display:flex;align-items:center;gap:10px;background:#F4F8FA;color:#234457;border:1px solid #E8EEF1;min-height:47px}
.ct-quickactions button:hover:not(:disabled){background:#E9F2F4;color:#215A68}
.ct-quickactions .ct-ico{color:#138080}
.ct-home-hero{display:flex;align-items:center;justify-content:space-between;gap:18px;border-radius:20px;background:linear-gradient(114deg,#10283E 0%,#1F5260 68%,#167D7D);color:#fff;margin-bottom:18px;padding:29px 31px}
.ct-home-hero .pretitle{color:#8ADAD5;letter-spacing:.13em;text-transform:uppercase;font-size:10px;font-weight:800}
.ct-home-hero h1{font-size:clamp(22px,3vw,33px);letter-spacing:-.05em;margin:5px 0 6px}
.ct-home-hero p{font-size:12px;color:#C8DADD;margin:0;max-width:580px}
.ct-home-hero .count{min-width:120px;border:1px solid #ffffff3b;background:#ffffff12;border-radius:15px;text-align:center;padding:14px 17px}
.ct-home-hero .count strong{font-size:29px;display:block;line-height:1.2}
.ct-home-hero .count span{color:#BDD6DB;font-size:10px}
.homegrid{grid-template-columns:minmax(0,1.4fr) minmax(295px,.82fr);gap:16px}
.homegrid .card{min-width:0}
.course{padding:16px 0;gap:15px}
.course h3{color:#23445A;font-size:15px;letter-spacing:-.025em}
.course .meta{font-size:11px}
.course > button{background:#E5F4F3;color:#0D7779;font-size:12px;white-space:nowrap}
.course > button:hover:not(:disabled){background:#CAE7E5}
.studenttable{border:1px solid #E0E9F0;border-radius:15px;box-shadow:var(--shadow)}
.studenthdr{background:#EAF0F5;color:#576F84;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.studenthdr > div{padding:11px 13px}
.studentgroup{border-top:1px solid #E8EEF3}
.studentgroup:nth-of-type(2n){background:#FCFDFE}
.studentmain{min-height:58px}
.studentmain>div{padding:10px 13px}
.serialcell{font-weight:800;color:#3F6A7B;font-size:13px}
.idcell{color:#668095;font-size:12px;font-variant-numeric:tabular-nums}
.studentname{color:#233E55;font-size:13px;line-height:1.3;font-weight:800}
.studentdetail{border-color:#E9EEF3;background:#F8FAFC}
.syncstrip{background:transparent}
.syncinner{padding:5px 11px 7px}
.attplain{min-height:40px;border-radius:9px}
.attplain:hover:not(:disabled){background:#E6F1F4}
.attplain.P{background:#EDF8F1}
.attplain.A{background:#FFF1EF}
.attplain.X{background:#EAF2FF}
.attcell{padding:2px 3px;flex-basis:83px}
.attweek{font-size:12px;color:#667C91}
.attmark{font-size:19px}
.studentgroup .rowmeta .badge{font-size:9px;padding:3px 7px;border-radius:6px}
.gradecell{flex-basis:119px}
.gradehead{font-size:10px;color:#667D90}
.scorebox input{border-radius:8px;height:35px}
.absbtn{height:35px;border-radius:8px}
.summarycell{background:#F1F6FB;border-right:1px solid #E3EBF3}
.summaryvalue{color:#25465A}
.searchbar{border-top-color:#E9EFF3;gap:10px}
.searchbar input{border-radius:11px;background:#F8FAFC}
.searchcount{font-size:11px;font-weight:600}
.attpanel{padding:21px}
.attlab select{font-size:21px;color:#25445B;font-weight:850}
.atthead>.badge{align-self:center}
.session{box-shadow:none;border-radius:14px;background:#F8FAFC;border-color:#E5ECF3;margin-top:15px}
.session-title{background:#EDF3F7;font-size:12px;color:#3A576D;padding:13px 15px}
.session-body{padding:13px 15px}
.session-actions button{min-height:43px;border-radius:10px}
.session-actions button:first-child{background:#E9F2F5;color:#2B6474}
.session-actions button:nth-child(2){background:#0D7C7C}
.session-actions button:nth-child(3){background:#1D455F}
.attpolicy{margin-top:13px}
.gradefilters{border-radius:12px;background:#F7FAFC;border-color:#E6EDF2;padding:13px;gap:10px}
.scopebar{padding-bottom:5px}
.focusov{background:#F2F7FA}
.focuscard,.focuscard.gradeidentity{border:1px solid #E0EAF0;box-shadow:0 13px 36px #14213d13;border-radius:20px}
.focusgradeconsole{background:#F8FBFD;border-color:#DFE8F1;box-shadow:0 -12px 35px #172d4420}
.focuskeypad button{border-radius:11px}
.focusactions .present{background:#0E8367}
.focusactions .absent{background:#BC4946}
.dialog{padding:24px;border-radius:19px;box-shadow:0 20px 55px #061b3440}
.lecturecard{background:#FCFDFE;border-radius:12px;border-color:#E4EBF2;padding:14px}
.adminsection{background:#FBFCFE;border-color:#E6EDF3;border-radius:14px;padding:16px}
.ct-mobile-nav{display:none}
.ct-appstatus{display:inline-flex;align-items:center;gap:5px;color:#A8D7D5;font-size:10px;margin-left:10px;font-weight:600}
.ct-appstatus:before{content:"";width:6px;height:6px;border-radius:50%;background:#5FE2C5}
@media(max-width:1100px){.workspace{grid-template-columns:204px minmax(0,1fr)}.workspace-side{padding-left:10px;padding-right:10px}.ct-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.ct-overview-lower{grid-template-columns:1fr}.shell{padding:19px}.coursebar{padding:19px 19px 7px}}
@media(max-width:760px){
 .appbar{min-height:59px;padding:9px 13px}.appbar .mark{height:34px;width:34px;border-radius:10px}.brand b{font-size:17px}.rolechip{display:none}.userchip .avatar{width:31px;height:31px}.appbar .ct-appstatus{display:none}
 .workspace{display:block;min-height:calc(100dvh - 59px)}.workspace-side{display:none}.workspace-main{min-height:calc(100dvh - 59px);padding-bottom:calc(69px + env(safe-area-inset-bottom))}
 .ct-mobile-nav{display:grid;position:fixed;bottom:0;left:0;right:0;grid-template-columns:repeat(6,minmax(0,1fr));z-index:38;background:#fff;border-top:1px solid #DCE6EE;box-shadow:0 -5px 16px #10243A12;padding:5px 5px calc(5px + env(safe-area-inset-bottom));gap:1px}
 .ct-mobile-nav .ct-nav-btn{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;width:100%;min-height:50px;padding:5px 1px;border-radius:9px;font-size:9px;text-align:center;font-weight:700}
 .ct-mobile-nav .ct-nav-btn .ct-ico{width:19px;height:19px;flex:0 0 19px}
 .ct-mobile-nav .ct-nav-btn span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block}
 .ct-mobile-nav .ct-ico svg{width:18px;height:18px}
 .coursebar{padding:15px 14px 3px;gap:9px}.coursetitle b{font-size:17px}.coursetitle span{font-size:10px;margin-top:2px}
 .courseback,.coursemenu{width:36px;height:36px;border-radius:10px}
 .workspace-main>.shell{padding:13px 12px 18px}.shell{padding:15px 12px}
 .ct-home-hero{padding:21px 20px;border-radius:16px}.ct-home-hero .count{min-width:77px;padding:12px 9px}.ct-home-hero .count strong{font-size:24px}
 .ct-overview-hero{padding:22px 20px;border-radius:16px}.ct-overview-hero h2{font-size:23px}.ct-stat{padding:16px}.ct-stat strong{font-size:25px}
 .ct-stats{gap:9px}.ct-overview-lower{gap:12px}.card{padding:15px;border-radius:15px}
 .section-title h2{font-size:17px}.attpanel{padding:15px}.attlab select{font-size:18px}
 .studentmain>div{padding:10px 7px}.studenthdr>div{padding:10px 7px}
 .studentname{font-size:13px}.studentdetail{background:#F9FBFC}
 .attcell{flex-basis:77px}
 .gradecell{flex-basis:104px}
 .ct-page-intro{display:none}

function safeLS(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(_){return null}}
function config(){if(EMBEDDED_FIREBASE_CONFIG.apiKey&&!EMBEDDED_FIREBASE_CONFIG.apiKey.startsWith('PASTE_'))return EMBEDDED_FIREBASE_CONFIG;let c={apiKey:'',authDomain:'',projectId:'',storageBucket:'',messagingSenderId:'',appId:''};try{const s=safeLS('coursetrackFirebase');if(s)c=JSON.parse(s)}catch(_){}return c}

function setupScreen(err=''){$('#app').innerHTML=`<div class=authwrap><div class="card authbox"><div class=authbrand><div class=mark>CT</div><div><h1>CourseTrack</h1><div class=meta>One-time Firebase setup on this device</div></div></div><p class=notice>This screen is only for setup/testing. For the published website, paste the Firebase configuration into this file before uploading to GitHub so instructors never see this screen.</p><label>Paste Firebase config<textarea id=cfg class=setupcode placeholder='apiKey: "...", authDomain: "..."'></textarea></label>${err?`<p style="color:var(--red)">${esc(err)}</p>`:''}<button onclick=saveSetup()>Save & continue</button></div></div>`}
function saveSetup(){const t=$('#cfg').value,o={};for(const m of t.matchAll(/(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId)\\s*:\\s*["']([^"']+)["']/g))o[m[1]]=m[2];if(!o.apiKey||!o.projectId||!o.appId)return alert('Could not find apiKey, projectId and appId. Paste the complete Firebase web config.');safeLS('coursetrackFirebase',JSON.stringify(o));location.reload()}
async function onAuth(u){clearSubs();S={...S,user:u,profile:null,memberships:[],courses:[],requests:[],facultyUsers:[],semesters:[],active:null,course:null,labs:[],students:[],members:[],loading:true};if(!u){pendingRegistration=null;return loginScreen()}try{const ref=db.doc('users/'+u.uid),snap=await ref.get();if(!snap.exists){if(pendingRegistration&&pendingRegistration.email.toLowerCase()===(u.email||'').toLowerCase()){const p=pendingRegistration;await ref.set({displayName:p.name,email:u.email||p.email,facultyId:p.facultyId,globalRole:'user',createdAt:$ts()});pendingRegistration=null}else{return completeProfileScreen(u)}}else if(!String(snap.data().facultyId||'').trim()){return completeProfileScreen(u,snap.data())}unsubs.push(ref.onSnapshot(d=>{if(!d.exists)return completeProfileScreen(u);const data=d.data();if(!String(data.facultyId||'').trim())return completeProfileScreen(u,data);S.profile={id:d.id,...data};subscribeHome()}));}catch(e){errorScreen(e)}}
function loginScreen(err=''){$('#app').innerHTML=`<div class=authwrap><div class="card authbox"><div class=authbrand><div class=mark>CT</div><div><h1>CourseTrack</h1><div class=meta>University Attendance & Grading</div></div></div><div class=stack><label>Email<input id=lem type=email autocomplete=email></label><label>Password<input id=lpw type=password autocomplete=current-password></label>${err?`<div style="color:var(--red)">${esc(err)}</div>`:''}<button onclick=signIn()>Sign in</button><button class=secondary onclick=registerScreen()>Create CourseTrack account</button><button class=linkbtn onclick=forgotPassword()>Forgot password?</button></div></div></div>`}
function registerScreen(){$('#app').innerHTML=`<div class=authwrap><div class="card authbox"><div class=authbrand><div class=mark>CT</div><div><h1>Create account</h1><div class=meta>Use your university email</div></div></div><div class=stack><label>Full name<input id=rname autocomplete=name></label><label>University email<input id=rem type=email autocomplete=email></label><label>Faculty code<input id=rfac placeholder="e.g. pharmacy" autocapitalize=none></label><label>Password<input id=rpw type=password autocomplete=new-password></label><label>Confirm password<input id=rpw2 type=password autocomplete=new-password></label><button onclick=registerUser()>Create account</button><button class=secondary onclick="loginScreen()">Back to sign in</button></div></div></div>`}
function completeProfileScreen(u,data={}){S.loading=false;const nm=String(data.displayName||u?.displayName||u?.email?.split('@')[0]||'').trim();$('#app').innerHTML=`<div class=authwrap><div class="card authbox"><div class=authbrand><div class=mark>CT</div><div><h1>Complete your account</h1><div class=meta>Your login exists, but the CourseTrack profile still needs a faculty code.</div></div></div><div class=stack><label>Full name<input id=cpname value="${esc(nm)}" autocomplete=name></label><label>Email<input value="${esc(u?.email||data.email||'')}" disabled></label><label>Faculty code<input id=cpfac placeholder="e.g. pharmacy" autocapitalize=none></label><button onclick=completeProfile()>Save & continue</button><button class=secondary onclick="auth.signOut()">Sign out</button></div></div></div>`}
async function completeProfile(){const name=$('#cpname').value.trim(),fac=$('#cpfac').value.trim().toLowerCase();if(!name||!fac)return alert('Enter your full name and faculty code.');try{const ref=db.doc('users/'+S.user.uid),snap=await ref.get();if(snap.exists)await ref.update({displayName:name,facultyId:fac,email:S.user.email||snap.data().email||''});else await ref.set({displayName:name,email:S.user.email||'',facultyId:fac,globalRole:'user',createdAt:$ts()});await S.user.updateProfile({displayName:name});location.reload()}catch(e){alert(e.message)}}

async function signIn(){try{await auth.signInWithEmailAndPassword($('#lem').value.trim(),$('#lpw').value)}catch(e){loginScreen(e.message)}}
async function registerUser(){const name=$('#rname').value.trim(),email=$('#rem').value.trim(),fac=$('#rfac').value.trim().toLowerCase(),pw=$('#rpw').value,pw2=$('#rpw2').value;if(!name||!email||!fac||pw.length<6)return alert('Enter name, email, faculty code and a password of at least 6 characters.');if(pw!==pw2)return alert('Passwords do not match.');pendingRegistration={name,email,facultyId:fac};try{const r=await auth.createUserWithEmailAndPassword(email,pw);await r.user.updateProfile({displayName:name})}catch(e){pendingRegistration=null;alert(e.message)}}
async function forgotPassword(){const email=prompt('Enter your CourseTrack email');if(!email)return;try{await auth.sendPasswordResetEmail(email.trim());alert('Password reset email sent.')}catch(e){alert(e.message)}}
function clearSubs(){courseSubs.forEach(f=>{try{f()}catch(_){}});courseSubs=[];unsubs.forEach(f=>{try{f()}catch(_){}});unsubs=[];homeSubscribed=false}
let homeSubscribed=false;function subscribeHome(){if(!S.profile||homeSubscribed)return;homeSubscribed=true;S.loading=true;render();const uid=S.user.uid,fac=S.profile.facultyId;unsubs.push(db.collection('memberships').where('uid','==',uid).onSnapshot(q=>{S.memberships=q.docs.map(d=>({_:d.id,...d.data()}));refreshCourses()}));unsubs.push(db.collection(`faculties/${fac}/semesters`).onSnapshot(q=>{S.semesters=q.docs.map(d=>({id:d.id,...d.data()}));render()}));if(S.profile.globalRole==='faculty_admin'){unsubs.push(db.collection('coordinatorRequests').where('facultyId','==',fac).onSnapshot(q=>{S.requests=q.docs.map(d=>({_:d.id,...d.data()})).filter(x=>x.status==='pending');render()}));unsubs.push(db.collection('users').where('facultyId','==',fac).onSnapshot(q=>{S.facultyUsers=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.displayName||a.email||'').localeCompare(String(b.displayName||b.email||'')));render()}));}}
async function refreshCourses(){const ids=[...new Set(S.memberships.filter(m=>m.approved).map(m=>m.courseId).filter(Boolean))];if(S.profile?.globalRole==='faculty_admin'){try{const q=await db.collection('courses').where('facultyId','==',S.profile.facultyId).get();q.docs.forEach(d=>ids.push(d.id))}catch(_){}}const uniq=[...new Set(ids)];const arr=[];for(const id of uniq){try{const d=await db.doc('courses/'+id).get();if(d.exists)arr.push({id:d.id,...d.data()})}catch(_){}}S.courses=arr.sort((a,b)=>(a.code||'').localeCompare(b.code||''));S.loading=false;const wanted=courseIdFromUrl();if(wanted&&!S.active&&S.courses.some(c=>c.id===wanted)){openCourse(wanted);return}render()}
function courseIdFromUrl(){try{return new URLSearchParams(location.search).get('course')||''}catch(_){return''}}
function semesterSort(a,b){return (+a.order||0)-(+b.order||0)||String(a.label||'').localeCompare(String(b.label||''))}

function selectableSemesters(){const rows=semesterRows().filter(x=>!x.closed);if(rows.length||S.semesters.length)return rows;return LEGACY_SEMS.map((label,i)=>({id:'legacy_'+i,label,current:i===0,closed:false,order:i*10,legacy:true}))}
function semesterOptions(){const rows=selectableSemesters();if(!rows.length)return'<option value="">No open semesters</option>';return rows.map(x=>`<option value="${esc(x.label)}" ${x.current?'selected':''}>${esc(x.label)}${x.current?' · Current':''}</option>`).join('')}
function semesterLabelExists(label){return semesterRows().some(x=>String(x.label||'').trim().toLowerCase()===String(label||'').trim().toLowerCase())}
function isFacultyAdmin(){return S.profile?.globalRole==='faculty_admin'}
function role(){const m=currentMembership();if(isFacultyAdmin())return m?.approved&&m.role==='coordinator'?'Faculty Admin · Coordinator':'Faculty Admin';return m?.role==='coordinator'?'Course Coordinator':m?.approved?'Course Instructor':'User'}

abs')}</div><div class=ct-labmain><b>${esc(l.name)}</b><span>${xs.length} students · ${done} attendance records for week ${w}</span></div><button class="secondary small" onclick="S.attLab='${l.id}';ctSwitchTab('attendance')">Open ${ctIcon('arrow')}</button></div>`}).join(''):'<div class=empty>No laboratory groups yet. Add labs from the Students page.</div>'}</section><section class=card><div class=section-title><div><h2>Quick actions</h2><p>Jump to your most-used tools.</p></div></div><div class=ct-quickactions><button onclick="ctSwitchTab('attendance')"><span class=ct-ico>${ctIcon('attendance')}</span> Attendance & QR scanning</button><button onclick="ctSwitchTab('grades')"><span class=ct-ico>${ctIcon('grades')}</span> Enter student grades</button><button onclick="ctSwitchTab('students')"><span class=ct-ico>${ctIcon('students')}</span> Manage student rosters</button><button onclick="ctSwitchTab('setup')"><span class=ct-ico>${ctIcon('setup')}</span> Course configuration</button></div><div class=notice style="margin-top:16px">Course data and permissions remain synchronized through your existing Firebase project.</div></section></div>`}

function studentsPage(){const c=S.course,lectures=Array.from({length:+c.lectures||3},(_,i)=>i+1),coord=isCoordinator(),total=S.students.length,assigned=S.students.filter(s=>s.lab).length,unassigned=total-assigned;return `<section class=card><div class=section-title><div><h2>Students</h2><p>Upload the original SIS roster for each lecture. Course serials are generated automatically: Lecture 1 by ascending ID, then Lecture 2, then Lecture 3, and so on.</p></div></div><div class=badges style="margin-bottom:10px"><span class=badge>${total} course students</span><span class="badge green">${assigned} assigned to labs</span><span class="badge ${unassigned?'warn':''}">${unassigned} unassigned</span></div><div class=lecturegrid>${lectures.map(n=>{const count=S.students.filter(s=>+s.lecture===n).length;return `<div class=lecturecard><div class=lecturehead><h3>Lecture ${n}</h3><span class=badge>${count} students</span></div><div class=fileline><input type=file accept=".xls,.xlsx" onchange="syncLecture(this,${n})" ${perm('roster')?'':'disabled'}><span class=meta>ID = column 2 · Name = column 3</span></div></div>`}).join('')}</div></section><section class=card style="margin-top:12px"><div class=section-title><div><h2>Laboratory rosters</h2><p>Upload the SIS roster for each lab. CourseTrack matches students by ID using the latest Firestore data. If a student exists in the lab roster but has not yet appeared in a lecture roster, the student is added safely and will be placed correctly once the lecture roster is uploaded.</p></div>${coord?'<button onclick=addLab()>+ Add lab</button>':''}</div>${S.labs.length?S.labs.map(l=>`<div class=lecturecard><div class=lecturehead><h3>${esc(l.name)}</h3><span class=badge>${S.students.filter(s=>s.lab===l.id).length} students</span><div class=spacer></div>${coord?`<button class="small danger" onclick="removeLab('${l.id}')">Remove</button>`:''}</div><div class=fileline><input type=file accept=".xls,.xlsx" onchange="syncLabRoster(this,'${l.id}')" ${perm('roster')?'':'disabled'}><span class=meta>Original SIS roster accepted · matched by Student ID</span></div></div>`).join(''):'<div class=empty>No labs yet.</div>'}</section>`}
function parseSisRows(wb){const sh=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(sh,{header:1,defval:'',raw:false}),out=[];for(const r of rows){let id=String(r[1]??'').trim(),name=String(r[2]??'').trim();if(!id||!name)continue;if(/^(id|student\s*id)$/i.test(id)||/^(name|student\s*name)$/i.test(name))continue;id=id.replace(/\.0$/,'');if(id.length<3)continue;out.push({sid:id,name})}const map=new Map;out.forEach(x=>map.set(x.sid,x));return [...map.values()]}
function readWorkbook(file){return new Promise((res,rej)=>{const r=new FileReader;r.onload=e=>{try{res(XLSX.read(e.target.result,{type:'array'}))}catch(x){rej(x)}};r.onerror=rej;r.readAsArrayBuffer(file)})}
async function writeChunks(ops){for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(fn=>fn(b));await b.commit()}}
function normStudentId(v){return String(v??'').trim().replace(/\.0$/,'')}
async function refreshStudentsNow(){const q=await db.collection(`courses/${S.active}/students`).get();S.students=q.docs.map(d=>({_:d.id,...d.data()})).filter(x=>x.active!==false).sort(serialCmp);render();return S.students}
async function syncLecture(inp,n){const f=inp.files[0];if(!f)return;try{const wb=await readWorkbook(f),rows=parseSisRows(wb);if(!rows.length)throw new Error('No student IDs/names were found in columns 2 and 3.');if(!confirm(`Lecture ${n}: ${rows.length} students found. Sync this roster?`))return;const coll=db.collection(`courses/${S.active}/students`),snap=await coll.get(),docs=snap.docs.map(d=>({_:d.id,...d.data()})),bySid=new Map(docs.map(s=>[normStudentId(s.sid),s])),incoming=new Set(rows.map(x=>normStudentId(x.sid))),ops=[];docs.filter(s=>+s.lecture===+n&&!incoming.has(normStudentId(s.sid))).forEach(s=>ops.push(b=>b.update(coll.doc(s._),{active:false})));let added=0,updated=0;rows.forEach(x=>{const sid=normStudentId(x.sid),ex=bySid.get(sid);if(ex){updated++;ops.push(b=>b.update(coll.doc(ex._),{sid,name:x.name,lecture:n,active:true}))}else{added++;const ref=coll.doc();bySid.set(sid,{_:ref.id,sid,name:x.name});ops.push(b=>b.set(ref,{sid,name:x.name,lecture:n,lab:'',serial:0,active:true,att:{},alt:{},g:{}}))}});await writeChunks(ops);await recomputeSerials();await refreshStudentsNow();alert(`Lecture ${n} synchronized successfully.\n${rows.length} students in file · ${added} added · ${updated} updated.`)}catch(e){alert(e.message)}finally{inp.value=''}}
async function recomputeSerials(){const q=await db.collection(`courses/${S.active}/students`).where('active','==',true).get(),xs=q.docs.map(d=>({_:d.id,...d.data()})).sort((a,b)=>(+a.lecture||999)-(+b.lecture||999)||normStudentId(a.sid).localeCompare(normStudentId(b.sid),undefined,{numeric:true})),ops=xs.map((s,i)=>b=>b.update(db.doc(`courses/${S.active}/students/${s._}`),{serial:i+1}));await writeChunks(ops)}
async function syncLabRoster(inp,labId){const f=inp.files[0];if(!f)return;try{const rows=parseSisRows(await readWorkbook(f));if(!rows.length)throw new Error('No students found in columns 2 and 3.');if(!confirm(`${labName(labId)}: ${rows.length} students found. Assign this roster?`))return;const coll=db.collection(`courses/${S.active}/students`),snap=await coll.get(),docs=snap.docs.map(d=>({_:d.id,...d.data()})),bySid=new Map(docs.map(s=>[normStudentId(s.sid),s])),ids=new Set(rows.map(x=>normStudentId(x.sid))),ops=[];docs.filter(s=>s.active!==false&&s.lab===labId&&!ids.has(normStudentId(s.sid))).forEach(s=>ops.push(b=>b.update(coll.doc(s._),{lab:''})));let assigned=0,added=0;for(const x of rows){const sid=normStudentId(x.sid),ex=bySid.get(sid);if(ex){assigned++;ops.push(b=>b.update(coll.doc(ex._),{sid,name:x.name,lab:labId,active:true}))}else{added++;assigned++;const ref=coll.doc();bySid.set(sid,{_:ref.id,sid,name:x.name});ops.push(b=>b.set(ref,{sid,name:x.name,lecture:null,lab:labId,serial:0,active:true,att:{},alt:{},g:{}}))}}await writeChunks(ops);if(added)await recomputeSerials();await refreshStudentsNow();const now=S.students.filter(s=>s.lab===labId).length;alert(`${labName(labId)} roster assigned successfully.\n${rows.length} students in file · ${assigned} assigned · ${added} newly added to the course.\n${now} students are now visible in this lab.`)}catch(e){alert(e.message)}finally{inp.value=''}}
async function addLab(){if(!isCoordinator())return;const name=prompt('Lab name, e.g. Lab 1');if(!name)return;await db.collection(`courses/${S.active}/labs`).add({name:name.trim(),place:'',staff:[],dates:{},locked:{},createdAt:$ts()})}
async function removeLab(id){if(!isCoordinator()||!confirm('Remove this lab? Students will become unassigned but their attendance/grades remain.'))return;const ops=S.students.filter(s=>s.lab===id).map(s=>b=>b.update(db.doc(`courses/${S.active}/students/${s._}`),{lab:''}));await writeChunks(ops);await db.doc(`courses/${S.active}/labs/${id}`).delete()}

function openQrStickers(){if(!window.QRCode)return alert('QR generator library did not load. Check internet connection.');$('#modal').innerHTML=`<div class=modal><div class=dialog style="width:min(900px,100%)"><div class=row><div class=grow><h2 style="margin:0">Student QR stickers</h2><div class=meta>QR content is the Student ID. Printed QR = 18 × 18 mm inside a 25 × 25 mm white sticker.</div></div><button onclick=window.print()>Print</button><button class=secondary onclick="$('#modal').innerHTML=''">Close</button></div><label style="margin-top:10px">Students<select id=qrscope onchange=renderQrStickers(this.value)><option value="">All labs</option>${S.labs.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></label><div id=qrprint style="margin-top:10px"><div id=qrgrid class=qrprintgrid></div></div></div></div>`;renderQrStickers('')}
function renderQrStickers(lab){const list=S.students.filter(s=>s.sid&&(!lab||s.lab===lab)).sort(serialCmp),g=$('#qrgrid');if(!g)return;g.innerHTML=list.map((s,i)=>`<div class=qrprintitem><div class=qrsticker><div id="qr_${i}"></div></div><div class=qrwho><b>${esc(s.serial||'—')} · ${esc(s.sid)}</b><br>${esc(s.name)}</div></div>`).join('');requestAnimationFrame(()=>list.forEach((s,i)=>new QRCode(document.getElementById('qr_'+i),{text:String(s.sid).trim(),width:256,height:256,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.Q})))}

async function startQrAttendance(){if(!window.Html5Qrcode)return alert('QR scanner library did not load. Check internet connection.');if(!canTakeAttendance()||isWeekLocked())return;$('#modal').innerHTML=`<div class=qrshade><div class=qrscanpanel><div id=qr-reader></div><div class=qrtop><b>QR attendance · ${esc(labName(S.attLab))} · Week ${S.attWeek}</b><div class=spacer></div><button class=secondary onclick=stopQr()>Close</button></div><div id=qrresult class=qrresult><div class=notice>Point the camera toward the student's QR. Precise alignment is not required.</div></div></div></div>`;try{QRSCAN=new Html5Qrcode('qr-reader');await QRSCAN.start({facingMode:'environment'},{fps:15},qrDecoded,()=>{});}catch(e){$('#qrresult').innerHTML=`<div class=notice style="background:#5a1212;color:#fff">Camera could not start: ${esc(e?.message||e)}<br>Check browser camera permission.</div>`}}async function stopQr(){if(QRSCAN){try{await QRSCAN.stop()}catch(_){}try{await QRSCAN.clear()}catch(_){}QRSCAN=null}$('#modal').innerHTML=''}let lastQr='',lastQrAt=0;async function qrDecoded(text){text=String(text||'').trim();const now=Date.now();if(text===lastQr&&now-lastQrAt<1800)return;lastQr=text;lastQrAt=now;const matches=S.students.filter(s=>String(s.sid).trim()===text);if(matches.length!==1)return qrStatus(matches.length?'Duplicate student ID':'Student not found',false);const s=matches[0],w=S.attWeek;if(s.lab===S.attLab){await db.doc(`courses/${S.active}/students/${s._}`).update({['att.'+w]:'P',['alt.'+w]:firebase.firestore.FieldValue.delete()});qrStatus(`${s.name} · Present`,true);return}const used=Object.values(s.att||{}).filter(x=>x==='X').length,lim=Math.max(0,+S.course.altLabLimit||0);if(used>=lim&&s.att?.[w]!=='X')return qrStatus(`${s.name} · visiting allowance reached`,false);await db.doc(`courses/${S.active}/students/${s._}`).update({['att.'+w]:'X',['alt.'+w]:S.attLab});qrStatus(`${s.name} · Present here as visitor`,true)}function qrStatus(t,ok){const e=$('#qrresult');if(e)e.innerHTML=`<div class=notice style="background:${ok?'#063':'#701'};color:#fff"><b>${esc(t)}</b></div>`;try{navigator.vibrate?.(ok?50:[40,60,40])}catch(_){}}

function detailMax(){const v=document.querySelector('.syncstrip'),i=v?.querySelector('.syncinner');return v&&i?Math.max(0,i.scrollWidth-v.clientWidth):0}function paintDetailScroll(){syncPaintRaf=0;document.documentElement.style.setProperty('--detail-shift',(-detailScrollX)+'px')}function setDetailScroll(x){detailScrollMax=detailMax();detailScrollX=Math.max(0,Math.min(detailScrollMax,Number.isFinite(x)?x:0));if(!syncPaintRaf)syncPaintRaf=requestAnimationFrame(paintDetailScroll)}function applySyncedScroll(){detailScrollMax=detailMax();detailScrollX=Math.min(detailScrollX,detailScrollMax);paintDetailScroll()}function stopSyncInertia(){if(syncInertiaRaf){cancelAnimationFrame(syncInertiaRaf);syncInertiaRaf=0}}function syncDragStart(e,el){if(e.pointerType==='mouse'&&e.button!==0)return;stopSyncInertia();detailScrollMax=detailMax();syncDrag={id:e.pointerId,startX:e.clientX,startY:e.clientY,startScroll:detailScrollX,lastT:performance.now(),v:0,moved:false,captured:false,el,target:e.target}}function syncDragMove(e){if(!syncDrag||e.pointerId!==syncDrag.id)return;const dx=e.clientX-syncDrag.startX,dy=e.clientY-syncDrag.startY;if(!syncDrag.moved){if(Math.abs(dx)<5)return;if(Math.abs(dy)>Math.abs(dx)*1.1){syncDrag=null;return}syncDrag.moved=true;syncSuppressClickUntil=performance.now()+320;syncDrag.el?.classList.add('dragging');if(syncDrag.target?.blur)syncDrag.target.blur();try{syncDrag.el?.setPointerCapture(e.pointerId);syncDrag.captured=true}catch(_){}}if(e.cancelable)e.preventDefault();const now=performance.now(),dt=Math.max(1,now-syncDrag.lastT),next=Math.max(0,Math.min(detailScrollMax,syncDrag.startScroll-dx)),prev=detailScrollX;setDetailScroll(next);syncDrag.v=(next-prev)/dt;syncDrag.lastT=now}function syncDragEnd(e){if(!syncDrag||e.pointerId!==syncDrag.id)return;const d=syncDrag;d.el?.classList.remove('dragging');if(d.captured)try{d.el?.releasePointerCapture(e.pointerId)}catch(_){}syncDrag=null;if(d.moved){syncSuppressClickUntil=performance.now()+320;startSyncInertia(d.v)}}function startSyncInertia(v){stopSyncInertia();if(Math.abs(v)<.05)return;let last=performance.now();const step=t=>{const dt=Math.min(32,t-last);last=t;const before=detailScrollX;setDetailScroll(detailScrollX+v*dt);if(detailScrollX===0||detailScrollX===detailScrollMax||Math.abs(detailScrollX-before)<.05)v=0;v*=Math.pow(.91,dt/16.67);if(Math.abs(v)>.02)syncInertiaRaf=requestAnimationFrame(step);else syncInertiaRaf=0};syncInertiaRaf=requestAnimationFrame(step)}function syncWheel(e){const d=Math.abs(e.deltaX)>=Math.abs(e.deltaY)?e.deltaX:(e.shiftKey?e.deltaY:0);if(!d)return;if(e.cancelable)e.preventDefault();stopSyncInertia();setDetailScroll(detailScrollX+d)}function syncClickGuard(){return performance.now()<syncSuppressClickUntil}
